<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <!-- Bootstrap CSS for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .login-card h2 {
            color: #007bff;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: bold;
        }

        /* Styling for the login link to make it look like a button */
        .btn-link-primary {
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            font-size: 1.1em;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: center;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
        }

        .btn-link-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            color: #fff;
        }

        .btn-link-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="text-center mb-4">Employee Login</h2>
            <form onsubmit="return false;">
                <div class="mb-3">
                    <label for="employeeId" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" id="employeeId">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <div class="error-msg" id="errorMsg"></div>
                <button type="button" class="btn-link-primary" id="loginBtn" onclick="handleLogin()">Login</button>
            </form>
            <div style="text-align:center; margin-top:15px; font-size:0.9em;">
                Don't have an account?
                <a href="http://localhost:3000/register" style="color:#007bff; text-decoration:none;">Register here</a>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const employeeId = document.getElementById('employeeId').value.trim();
            const password   = document.getElementById('password').value;
            const btn        = document.getElementById('loginBtn');
            const errorMsg   = document.getElementById('errorMsg');

            errorMsg.textContent = '';
            errorMsg.classList.remove('show');

            if (!employeeId || !password) {
                errorMsg.textContent = 'Please enter both Employee ID and password.';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employeeId, password }),
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('employee', JSON.stringify(data.employee));
                    // Route based on role: admin → dashboard, faculty → leave form
                    if (data.employee.role === 'admin') {
                        window.location.href = 'http://localhost:3000/dashboard';
                    } else {
                        window.location.href = 'http://localhost:3000/form';
                    }
                } else {
                    errorMsg.textContent = data.message || 'Login failed. Please try again.';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = 'Cannot reach server. Make sure "node server.js" is running.';
                errorMsg.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
