<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .register-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .register-card h2 {
            color: #007bff;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-primary-custom {
            background-color: #007bff;
            border: none;
            color: #fff;
            padding: 10px 15px;
            font-size: 1.1em;
            display: block;
            width: 100%;
            text-align: center;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }

        .btn-primary-custom:hover {
            background-color: #0056b3;
        }

        .btn-primary-custom:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert-msg {
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .alert-msg.error   { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; display: block; }
        .alert-msg.success { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; display: block; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <h2 class="text-center mb-4">Create Account</h2>

            <form onsubmit="return false;">
                <div class="mb-3">
                    <label for="employeeId" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" id="employeeId" placeholder="e.g. EMP005">
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="e.g. Dr. John Doe">
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label">Department</label>
                    <select class="form-select" id="department">
                        <option value="" disabled selected>Choose department...</option>
                        <option>Computer Science</option>
                        <option>Mechanical Engineering</option>
                        <option>Humanities</option>
                        <option>Mathematics</option>
                        <option>Administration</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role">
                        <option value="" disabled selected>Choose role...</option>
                        <option value="faculty">Faculty</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Min. 6 characters">
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password">
                </div>

                <div class="alert-msg" id="alertMsg"></div>

                <button type="button" class="btn-primary-custom" id="registerBtn" onclick="handleRegister()">
                    Register
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="http://localhost:3000/">Login here</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const employeeId      = document.getElementById('employeeId').value.trim();
            const name            = document.getElementById('name').value.trim();
            const department      = document.getElementById('department').value;
            const role            = document.getElementById('role').value;
            const password        = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn             = document.getElementById('registerBtn');
            const alertMsg        = document.getElementById('alertMsg');

            // Reset alert
            alertMsg.className = 'alert-msg';
            alertMsg.textContent = '';

            // Validation
            if (!employeeId || !name || !department || !role || !password || !confirmPassword) {
                showAlert('error', 'Please fill in all fields.');
                return;
            }
            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters.');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('error', 'Passwords do not match.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Registering...';

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employeeId, name, department, role, password }),
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', '✅ ' + data.message + ' Redirecting to login...');
                    setTimeout(() => { window.location.href = 'http://localhost:3000/'; }, 2000);
                } else {
                    showAlert('error', data.message || 'Registration failed.');
                }
            } catch (err) {
                showAlert('error', 'Cannot reach server. Make sure "node server.js" is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        }

        function showAlert(type, message) {
            const el = document.getElementById('alertMsg');
            el.className = `alert-msg ${type}`;
            el.textContent = message;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
